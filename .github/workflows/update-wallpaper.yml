name: Update Bing Wallpaper

on:
  schedule:
    - cron: "2 7 * * *" # 每天 UTC 时间 07:02 运行（北京时间 15:02）
    - cron: "2 16 * * *" # 每天 UTC 时间 16:02 运行（北京时间 00:02）
  push:
    branches: [main]
    paths:
      - "index.html"
      - "api/index.html"
      - "screenshot.js"
      - ".github/workflows/update-wallpaper.yml"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-wallpaper
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # --- 第一阶段：抓取 Bing 数据并生成待发布目录 dist/ ---
      - name: Generate JSON data
        run: |
          mkdir -p dist/api
          cp index.html dist/
          cp api/index.html dist/api/

          # 获取 Bing API 数据（横屏）
          curl -s "https://global.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&pid=hp&FORM=BEHPTB&uhd=1&uhdwidth=3840&uhdheight=2160&setmkt=zh-CN&setlang=en" -o bing.json
          # 获取 Bing API 数据（竖屏）
          curl -s "https://global.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&pid=hp&FORM=BEHPTB&uhd=1&uhdwidth=2160&uhdheight=3840&setmkt=zh-CN&setlang=en" -o bing_portrait.json

          # 用 jq 生成 JSON，标题/版权里的引号不会破坏格式
          jq -n \
            --arg title "$(jq -r '.images[0].title' bing.json)" \
            --arg copyright "$(jq -r '.images[0].copyright' bing.json)" \
            --arg url "https://cn.bing.com$(jq -r '.images[0].url' bing.json)" \
            --arg portrait_url "https://cn.bing.com$(jq -r '.images[0].url' bing_portrait.json)" \
            --arg date "$(TZ=Asia/Shanghai date +%F)" \
            '{title: $title, copyright: $copyright, url: $url, portrait_url: $portrait_url, date: $date}' \
            > dist/wallpaper-data.json

          cat dist/wallpaper-data.json

      # --- 第二阶段：准备 Node 环境并执行截图 ---
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Puppeteer
        run: |
          npm init -y
          npm install puppeteer@25
          npm ls puppeteer --depth=0

      - name: Install Noto Sans SC Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f -v  # 强制刷新字体缓存

      - name: Take Screenshot
        run: node screenshot.js dist/wallpaper-data.json dist/api

      - name: Verify screenshots
        run: |
          for f in dist/api/today.jpg dist/api/today_portrait.jpg; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 100000 ]; then
              echo "::error::$f 体积异常（$size 字节），疑似未渲染完成"
              exit 1
            fi
          done
          ls -lh dist/api

      # --- 第三阶段：发布到 GitHub Pages（产物不进 git） ---
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
